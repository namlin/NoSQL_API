services:
    neo4j:
        image: neo4j:5-community
        container_name: neo4j_container
        ports:
            - "7474:7474"
            - "7687:7687"
        restart: unless-stopped
        environment:
            NEO4J_AUTH: none
        volumes:
            - neo4j-volume:/data

volumes:
    neo4j-volume: